<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Spend Policy Engine</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <h1>Agent Spend Policy Engine</h1>
      <span class="badge"><span class="badge-dot"></span>Algorand Testnet &middot; x402</span>
    </div>
    <div class="topbar-actions">
      <label class="autoplay">
        <input type="checkbox" id="autoplayToggle" />
        Autoplay demo traffic
      </label>
      <button id="resetBtn" class="btn btn-ghost" title="Clears the local audit log only, no on-chain effect">
        Reset demo log
      </button>
    </div>
  </header>

  <main>
    <p class="section-label">Agents</p>
    <section id="agents" class="agents-grid"></section>

    <div class="feed-section-head">
      <p class="section-label" style="margin-bottom: 0;">Live Request Feed</p>
      <span class="feed-count" id="feedCount"></span>
    </div>
    <div class="feed-table-wrap">
      <table class="feed-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>Agent</th>
            <th>Action</th>
            <th>Amount</th>
            <th>Decision</th>
            <th>Reason</th>
            <th>Algorand Tx</th>
          </tr>
        </thead>
        <tbody id="feedBody"></tbody>
      </table>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
